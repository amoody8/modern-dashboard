name: CI

on:
  push:
  pull_request:

jobs:
  php:
    name: PHP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          coverage: none
          tools: composer

      - name: Syntax check
        run: find . -path ./node_modules -prune -o -path ./vendor -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Coding standards
        run: composer lint

      - name: Smoke tests
        run: composer test

  js:
    name: JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint:js

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # wp-scripts takes entry points as positional arguments, which works only
      # because --output-path is not one of the flags it treats as an output
      # option. That is undocumented, so assert both entries actually built
      # rather than letting a silent one-entry build reach the staleness check.
      - name: Verify both bundles built
        run: |
          test -f build/index.js
          test -f build/index.asset.php
          test -f build/palette.js
          test -f build/palette.asset.php

      - name: Fail if the committed build is stale
        run: git diff --exit-code -- build/
